apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pierpont-db
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: pierpont-db } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: pierpont-web } } }]
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pierpont-ml
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: pierpont-ml } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: pierpont-web } } }]
      ports: [{ port: 8000 }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pierpont-web
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: pierpont-web } }
  policyTypes: [Ingress]
  ingress:
    # ingress-nginx runs on the host network, so it can't be matched by namespace
    - ports: [{ port: 8080 }]
