apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pierpont-storage
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources: { requests: { storage: {{ .Values.web.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: pierpont-web
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: pierpont-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pierpont-web
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: pierpont-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pierpont-web, app.kubernetes.io/part-of: pierpont }
    spec:
      {{- include "pierpont.pullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: "{{ .Values.web.image }}:{{ .Values.web.tag }}"
          env:
            - { name: DB_HOST, value: pierpont-db }
            - { name: DB_USER, value: pierpont }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secretName }}, key: POSTGRES_PASSWORD } }
            - name: SECRET_KEY_BASE
              valueFrom: { secretKeyRef: { name: {{ .Values.web.secretName }}, key: SECRET_KEY_BASE } }
            - { name: ML_URL, value: "http://pierpont-ml:8000" }
            - { name: APP_HOSTS, value: {{ .Values.host | quote }} }
            - { name: SOLID_QUEUE_IN_PUMA, value: "1" }
            - { name: WEB_CONCURRENCY, value: "0" }
            - { name: RAILS_MAX_THREADS, value: "5" }
            - { name: JOB_CONCURRENCY, value: "1" }
            - { name: RAILS_LOG_LEVEL, value: info }
            - { name: HTTP_PORT, value: "8080" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /up, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /up, port: http }, periodSeconds: 30, failureThreshold: 4 }
          startupProbe: { httpGet: { path: /up, port: http }, periodSeconds: 5, failureThreshold: 60 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: storage, mountPath: /rails/storage }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: pierpont-storage }
