apiVersion: v1
kind: Service
metadata:
  name: pierpont-db
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: pierpont-db }
  ports: [{ name: pg, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pierpont-db
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  serviceName: pierpont-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pierpont-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pierpont-db, app.kubernetes.io/part-of: pierpont }
    spec:
      securityContext: { fsGroup: 70 }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB", "-c", "effective_cache_size=192MB"]
          env:
            - { name: POSTGRES_USER, value: pierpont }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secretName }}, key: POSTGRES_PASSWORD } }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, pierpont] }
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: { runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
