apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pierpont-models
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources: { requests: { storage: {{ .Values.ml.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: pierpont-ml
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: pierpont-ml }
  ports: [{ name: http, port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pierpont-ml
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: pierpont-ml }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pierpont-ml, app.kubernetes.io/part-of: pierpont }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      {{- include "pierpont.pullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ml
          image: "{{ .Values.ml.image }}:{{ .Values.ml.tag }}"
          env:
            - { name: ORT_THREADS, value: {{ .Values.ml.threads | quote }} }
            - { name: OMP_NUM_THREADS, value: {{ .Values.ml.threads | quote }} }
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 30, failureThreshold: 4 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 3, failureThreshold: 40 }
          resources: {{- toYaml .Values.ml.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: pierpont-models }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pierpont-ml-retrain
  labels: {{- include "pierpont.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.ml.retrain.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app.kubernetes.io/name: pierpont-ml-retrain, app.kubernetes.io/part-of: pierpont }
        spec:
          restartPolicy: Never
          {{- include "pierpont.pullSecrets" . | nindent 10 }}
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: retrain
              image: "{{ .Values.ml.image }}:{{ .Values.ml.tag }}"
              command: [python, -m, pierpont_ml.train, --models, /models]
              env: [{ name: OMP_NUM_THREADS, value: "2" }]
              resources: {{- toYaml .Values.ml.retrain.resources | nindent 16 }}
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts:
                - { name: models, mountPath: /models }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: models
              persistentVolumeClaim: { claimName: pierpont-models }
            - name: tmp
              emptyDir: { sizeLimit: 128Mi }
